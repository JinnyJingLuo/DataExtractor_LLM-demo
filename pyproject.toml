[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dataextractor-heldout"
version = "0.1.0"
description = "Reproducible Gemini API and held-out evaluation pipeline"
requires-python = ">=3.10"
dependencies = [
  "anthropic[vertex]>=0.75,<1",
  "google-genai>=1.51.0,<2",
  "google-generativeai>=0.8,<1",
  "openpyxl>=3.1,<4",
  "pandas>=2.2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
heldout-pipeline = "heldout_pipeline.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
